name: CI

on:
    push:
        branches: [master, main]
    pull_request:

jobs:
    check:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                node: [20, 22]
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm
            - run: npm ci
            - run: npx tsc --noEmit -p tsconfig.eval.json
            - run: npm run check
            - run: npm run build
